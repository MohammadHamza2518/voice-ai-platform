services:
  - type: web
    name: voice-ai-platform
    runtime: node
    region: singapore
    plan: free
    autoDeploy: true
    buildCommand: npm run build || true
    startCommand: node server/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: VAPI_API_KEY
        sync: false
      - key: VAPI_PHONE_NUMBER_ID
        sync: false
      - key: JWT_SECRET
        generateValue: true
